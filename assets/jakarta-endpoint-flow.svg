<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-labelledby="title desc">
  <title id="title">Jakarta ServerEndpoint 注册与生命周期</title>
  <desc id="desc">Spring Boot 通过 ServerEndpointExporter 注册带注解的 Jakarta endpoint，容器调用生命周期方法。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#165d63"/></marker>
    <style>
      .box { fill: #e4f0ee; stroke: #165d63; stroke-width: 2; }
      .label { font: 700 17px system-ui, sans-serif; fill: #17202a; }
      .small { font: 14px ui-monospace, monospace; fill: #17202a; }
      .arrow { stroke: #165d63; stroke-width: 2.5; marker-end: url(#arrow); }
      .muted { font: 14px system-ui, sans-serif; fill: #5e6b78; }
    </style>
  </defs>
  <rect width="900" height="230" fill="#fbfaf7"/>
  <rect x="25" y="75" width="170" height="70" rx="5" class="box"/>
  <rect x="250" y="75" width="220" height="70" rx="5" class="box"/>
  <rect x="525" y="75" width="180" height="70" rx="5" class="box"/>
  <rect x="760" y="75" width="115" height="70" rx="5" class="box"/>
  <text x="110" y="104" text-anchor="middle" class="label">Spring Boot</text>
  <text x="110" y="126" text-anchor="middle" class="small">application start</text>
  <text x="360" y="104" text-anchor="middle" class="label">ServerEndpointExporter</text>
  <text x="360" y="126" text-anchor="middle" class="small">register endpoint</text>
  <text x="615" y="104" text-anchor="middle" class="label">@ServerEndpoint</text>
  <text x="615" y="126" text-anchor="middle" class="small">/ws/jakarta-echo</text>
  <text x="817" y="104" text-anchor="middle" class="label">Container</text>
  <text x="817" y="126" text-anchor="middle" class="small">callbacks</text>
  <line x1="195" y1="110" x2="245" y2="110" class="arrow"/>
  <line x1="470" y1="110" x2="520" y2="110" class="arrow"/>
  <line x1="705" y1="110" x2="755" y2="110" class="arrow"/>
  <text x="450" y="190" text-anchor="middle" class="muted">路径来自注解，@OnOpen / @OnMessage / @OnClose 由容器回调</text>
</svg>
