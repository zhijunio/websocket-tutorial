<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">WebSocket 结业验收关系图</title>
  <desc id="desc">协议、实现、可靠性和性能四类证据共同支撑 G1、G2、G3 和面试验收。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#165d63"/></marker>
    <style>
      .box { fill: #e4f0ee; stroke: #165d63; stroke-width: 2; }
      .goal { fill: #f4e7dd; stroke: #a65b2b; stroke-width: 2; }
      .label { font: 700 17px system-ui, sans-serif; fill: #17202a; }
      .small { font: 14px system-ui, sans-serif; fill: #17202a; }
      .muted { font: 14px system-ui, sans-serif; fill: #5e6b78; }
      .arrow { stroke: #165d63; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1000" height="390" fill="#fbfaf7"/>
  <text x="500" y="32" text-anchor="middle" class="label">结业验收不是只看代码是否能启动</text>
  <rect x="45" y="80" width="200" height="70" rx="6" class="box"/>
  <rect x="285" y="80" width="200" height="70" rx="6" class="box"/>
  <rect x="525" y="80" width="200" height="70" rx="6" class="box"/>
  <rect x="765" y="80" width="190" height="70" rx="6" class="box"/>
  <text x="145" y="112" text-anchor="middle" class="label">协议证据</text>
  <text x="145" y="134" text-anchor="middle" class="small">RFC / 抓包 / close code</text>
  <text x="385" y="112" text-anchor="middle" class="label">实现证据</text>
  <text x="385" y="134" text-anchor="middle" class="small">代码 / 测试 / README</text>
  <text x="625" y="112" text-anchor="middle" class="label">运行证据</text>
  <text x="625" y="134" text-anchor="middle" class="small">日志 / 指标 / 失败复现</text>
  <text x="860" y="112" text-anchor="middle" class="label">表达证据</text>
  <text x="860" y="134" text-anchor="middle" class="small">2 分钟 / 白板 / 权衡</text>
  <line x1="145" y1="155" x2="300" y2="270" class="arrow"/>
  <line x1="385" y1="155" x2="400" y2="270" class="arrow"/>
  <line x1="625" y1="155" x2="600" y2="270" class="arrow"/>
  <line x1="860" y1="155" x2="700" y2="270" class="arrow"/>
  <rect x="110" y="270" width="220" height="70" rx="6" class="goal"/>
  <rect x="390" y="270" width="220" height="70" rx="6" class="goal"/>
  <rect x="670" y="270" width="220" height="70" rx="6" class="goal"/>
  <text x="220" y="302" text-anchor="middle" class="label">G1 多房间聊天</text>
  <text x="220" y="324" text-anchor="middle" class="small">隔离 / 清理 / 广播</text>
  <text x="500" y="302" text-anchor="middle" class="label">G2 推送通知</text>
  <text x="500" y="324" text-anchor="middle" class="small">在线 / 补拉 / 幂等</text>
  <text x="780" y="302" text-anchor="middle" class="label">G3 性能基准</text>
  <text x="780" y="324" text-anchor="middle" class="small">吞吐 / p95 / 资源</text>
</svg>
