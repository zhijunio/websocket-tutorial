<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">WebSocket 性能基准测量路径</title>
  <desc id="desc">负载客户端通过 WebSocket 发送带时间戳的消息，服务端回显，客户端统计往返延迟，Docker 记录服务端资源。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#165d63"/></marker>
    <style>
      .box { fill: #e4f0ee; stroke: #165d63; stroke-width: 2; }
      .label { font: 700 18px system-ui, sans-serif; fill: #17202a; }
      .small { font: 14px ui-monospace, monospace; fill: #17202a; }
      .muted { font: 14px system-ui, sans-serif; fill: #5e6b78; }
      .arrow { stroke: #165d63; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1000" height="300" fill="#fbfaf7"/>
  <rect x="30" y="95" width="220" height="85" rx="6" class="box"/>
  <rect x="390" y="95" width="220" height="85" rx="6" class="box"/>
  <rect x="750" y="95" width="220" height="85" rx="6" class="box"/>
  <text x="140" y="128" text-anchor="middle" class="label">LoadTestRunner</text>
  <text x="140" y="153" text-anchor="middle" class="small">100 × 10 msg/s</text>
  <text x="500" y="128" text-anchor="middle" class="label">Spring WebSocket</text>
  <text x="500" y="153" text-anchor="middle" class="small">echo handler</text>
  <text x="860" y="128" text-anchor="middle" class="label">Latency metrics</text>
  <text x="860" y="153" text-anchor="middle" class="small">throughput / p50 / p95</text>
  <line x1="255" y1="125" x2="385" y2="125" class="arrow"/>
  <line x1="385" y1="160" x2="255" y2="160" class="arrow"/>
  <line x1="615" y1="137" x2="745" y2="137" class="arrow"/>
  <text x="320" y="112" text-anchor="middle" class="muted">send timestamped payload</text>
  <text x="680" y="124" text-anchor="middle" class="muted">measure echo RTT</text>
  <text x="500" y="245" text-anchor="middle" class="muted">另用 Docker stats 记录服务端 CPU 与内存，不能把客户端指标当服务端指标</text>
</svg>
