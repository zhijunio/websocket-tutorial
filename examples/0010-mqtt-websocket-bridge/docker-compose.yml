services:
  mqtt:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 2"]
      interval: 2s
      timeout: 3s
      retries: 15
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      MQTT_ENABLED: "true"
      MQTT_BROKER_URL: tcp://mqtt:1883
      MQTT_CLIENT_ID: websocket-bridge
    depends_on:
      mqtt:
        condition: service_healthy
