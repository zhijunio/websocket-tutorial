services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: websocket
      POSTGRES_USER: websocket
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U websocket -d websocket"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  app-a:
    build: .
    environment:
      SERVER_PORT: 8080
      INSTANCE_ID: app-a
      DATABASE_URL: jdbc:postgresql://postgres:5432/websocket
      DATABASE_USERNAME: websocket
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      WS_ALLOWED_ORIGINS: http://localhost:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  app-b:
    build: .
    environment:
      SERVER_PORT: 8080
      INSTANCE_ID: app-b
      DATABASE_URL: jdbc:postgresql://postgres:5432/websocket
      DATABASE_USERNAME: websocket
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      WS_ALLOWED_ORIGINS: http://localhost:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src/main/resources/static:/usr/share/nginx/html:ro
    depends_on:
      app-a:
        condition: service_healthy
      app-b:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
