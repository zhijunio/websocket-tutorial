server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: production-notification-system
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/websocket}
    username: ${DATABASE_USERNAME:websocket}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  session:
    store-type: redis
    timeout: ${SESSION_TIMEOUT:30m}
    redis:
      namespace: ${SESSION_REDIS_NAMESPACE:ws:session}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  instance-id: ${INSTANCE_ID:local}
  tenant-id: ${TENANT_ID:demo}
  ticket-ttl: ${WS_TICKET_TTL:30s}
  presence-ttl: ${WS_PRESENCE_TTL:45s}
  heartbeat-interval: ${WS_HEARTBEAT_INTERVAL:15s}
  outbound-queue-capacity: ${WS_OUTBOUND_QUEUE_CAPACITY:100}
  max-message-bytes: ${WS_MAX_MESSAGE_BYTES:8192}
  max-connections-per-user: ${WS_MAX_CONNECTIONS_PER_USER:5}
  max-connections-per-instance: ${WS_MAX_CONNECTIONS_PER_INSTANCE:10000}
  max-connections-per-ip: ${WS_MAX_CONNECTIONS_PER_IP:100}
  max-connections-per-tenant: ${WS_MAX_CONNECTIONS_PER_TENANT:20000}
  max-handshakes-per-minute: ${WS_MAX_HANDSHAKES_PER_MINUTE:120}
  max-notification-rate: ${WS_MAX_NOTIFICATION_RATE:600}
  stream-max-length: ${WS_STREAM_MAX_LENGTH:100000}
  max-outbox-attempts: ${WS_MAX_OUTBOX_ATTEMPTS:10}
  allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:8081,http://localhost:8082}
  jwt-secret: ${JWT_SECRET}
