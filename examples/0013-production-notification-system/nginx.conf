events {}

http {
    # $uri intentionally excludes query parameters: WebSocket tickets must never
    # appear in access logs.
    log_format main '$remote_addr $uri $status upstream=$upstream_addr upstream_status=$upstream_status';
    access_log /dev/stderr main;

    upstream websocket_apps {
        server app-a:8080;
        server app-b:8080;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;

        location / {
            try_files $uri /index.html;
        }

        location /ws/ {
            proxy_pass http://websocket_apps;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
        }

        location /api/ {
            proxy_pass http://websocket_apps;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /actuator/health {
            proxy_pass http://websocket_apps;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
