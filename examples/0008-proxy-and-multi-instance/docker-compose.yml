services:
  app-a:
    build: .
    environment:
      INSTANCE_ID: app-a
      SERVER_PORT: 8080
  app-b:
    build: .
    environment:
      INSTANCE_ID: app-b
      SERVER_PORT: 8080
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-a
      - app-b
